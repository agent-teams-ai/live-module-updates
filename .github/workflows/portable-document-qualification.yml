name: Packed headless fixture qualification

# Representative ordinary-library proof, not LMU/EF production admission.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/portable-document-qualification.yml'
      - 'tests/qualification/portable-document/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/portable-document-qualification.yml'
      - 'tests/qualification/portable-document/**'
permissions:
  contents: read
jobs:
  portable-document:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests/qualification/portable-document
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.22.3
      - uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9
        with:
          version: 11.25.0
          package_json_file: tests/qualification/portable-document/package.json
      - name: Record exact source and install the frozen tool graph
        env:
          QUALIFICATION_PR_HEAD: ${{ github.event.pull_request.head.sha }}
          QUALIFICATION_PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          mkdir -p .qualification/evidence/inputs
          source_sha="$(git rev-parse HEAD)"
          printf 'QUALIFICATION_SOURCE_SHA=%s\nQUALIFICATION_PR_HEAD=%s\nQUALIFICATION_PR_BASE=%s\n' "$source_sha" "$QUALIFICATION_PR_HEAD" "$QUALIFICATION_PR_BASE" >> "$GITHUB_ENV"
          printf 'source=%s\nevent=%s\npr_head=%s\npr_base=%s\nrun=%s\nattempt=%s\n' "$source_sha" "$GITHUB_SHA" "$QUALIFICATION_PR_HEAD" "$QUALIFICATION_PR_BASE" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > .qualification/evidence/run.txt
          test "$(node --version)" = v24.22.3
          test "$(pnpm --version)" = 11.25.0
          git ls-files -z -- . | sort -z | xargs -0 sha256sum > .qualification/evidence/input-sha256.txt
          sha256sum "$GITHUB_WORKSPACE/.github/workflows/portable-document-qualification.yml" >> .qualification/evidence/input-sha256.txt
          cp "$GITHUB_WORKSPACE/.github/workflows/portable-document-qualification.yml" .qualification/evidence/inputs/
          pnpm install --frozen-lockfile --ignore-scripts --engine-strict --strict-peer-dependencies 2>&1 | tee .qualification/evidence/install.log
          test "$(node_modules/.bin/tsc --version)" = 'Version 7.0.2'
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const expected=JSON.parse(fs.readFileSync("package.json","utf8")).devDependencies; const actual=Object.fromEntries(Object.keys(expected).map(name=>[name,JSON.parse(fs.readFileSync(`node_modules/${name}/package.json`,"utf8")).version])); assert.deepEqual(actual,expected); fs.writeFileSync(".qualification/evidence/tool-versions.json",JSON.stringify(actual,null,2)+"\n");'
      - name: Check strict TypeScript and build the ES-only portable core
        run: |
          set -euo pipefail
          pnpm check 2>&1 | tee .qualification/evidence/typecheck-and-source.log
          node_modules/.bin/tsc -p tsconfig.core.json 2>&1 | tee .qualification/evidence/core-build.log
      - name: Install the pinned real Chromium headless shell
        run: |
          set -euo pipefail
          node_modules/.bin/playwright install --with-deps chromium --only-shell 2>&1 | tee .qualification/evidence/browser-install.log
          node --input-type=module -e 'import fs from "node:fs"; import path from "node:path"; import {createRequire} from "node:module"; const require=createRequire(import.meta.resolve("playwright")); const manifest=path.join(path.dirname(require.resolve("playwright-core/package.json")),"browsers.json"); fs.copyFileSync(manifest,".qualification/evidence/browser-builds.json");'
      - name: Execute packed consumers, independent Hosts, resets and rejecting control
        run: |
          set -euo pipefail
          pnpm qualify 2>&1 | tee .qualification/evidence/native.log
      - name: Retain exact inputs and observations even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: portable-document-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/qualification/portable-document/.qualification/evidence/
            tests/qualification/portable-document/*.ts
            tests/qualification/portable-document/*.json
            tests/qualification/portable-document/pnpm-lock.yaml
            tests/qualification/portable-document/core/
            tests/qualification/portable-document/consumer/
            tests/qualification/portable-document/artifact/
            tests/qualification/portable-document/adapter/
            tests/qualification/portable-document/architecture/
            tests/qualification/portable-document/*.yaml
            tests/qualification/portable-document/README.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
