name: Prepare current tooling locks
on:
  push:
    branches: [chore/current-tooling-and-module-reuse-20261127]
    paths:
      - package.json
      - pnpm-workspace.yaml
      - tests/qualification/portable-document/package.json
      - tests/qualification/portable-document/pnpm-workspace.yaml
      - .github/workflows/tooling-upgrade-preparation.yml
      - foundation.config.yaml
      - architecture/feature-module-profile.json
      - architecture/foundation/source-coverage.yaml
      - toolchain.config.json
      - scripts/check-quality-topology.ts
      - scripts/prepare-tooling-upgrade.ts
permissions:
  contents: read
jobs:
  prepare:
    name: prepare-tooling-locks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.22.3
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 11.25.0
          run_install: false
      - name: Generate reviewable canonical locks
        run: |
          pnpm install --lockfile-only --ignore-scripts --engine-strict --strict-peer-dependencies
          pnpm --dir tests/qualification/portable-document install --lockfile-only --ignore-scripts --engine-strict --strict-peer-dependencies
      - name: Install the prepared development graph
        run: pnpm install --frozen-lockfile --ignore-scripts --engine-strict --strict-peer-dependencies
      - name: Check the initialized compiler and preparation source
        run: pnpm run quality:compiler-floor && pnpm exec stack-toolchain compile --project tsconfig.tools.json
      - name: Generate topology through the published FMS projection
        run: node scripts/check-quality-topology.ts --write
      - name: Emit exact prepared bytes for review
        run: node scripts/prepare-tooling-upgrade.ts
      - name: Retain prepared locks
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tooling-preparation-locks
          path: |
            pnpm-lock.yaml
            tests/qualification/portable-document/pnpm-lock.yaml
            architecture/foundation/source-topology.json
          if-no-files-found: error
